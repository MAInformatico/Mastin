services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mastin-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build: ./producer
    container_name: mastin-producer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_PORT: 5672
      HOSTS_FILE: /app/hosts.txt
      DICTIONARY_FILE: /app/dictionary.txt
      CHECK_INTERVAL: 300
    volumes:
      - ./producer/hosts.txt:/app/hosts.txt
      - ./producer/dictionary.txt:/app/dictionary.txt
    restart: unless-stopped

  consumer:
    build: ./consumer
    container_name: mastin-consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_PORT: 5672
    restart: unless-stopped